<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>PolybAIus enemy gallery</title>
<style>html,body{margin:0;background:#020608;}canvas{display:block;}</style>
</head>
<body>
<canvas id="cv" width="840" height="400"></canvas>
<script>
"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const BUGS=[
 ["rootkit","#ff3366","ROOTKIT"],["voltworm","#ffe14a","VOLTWORM"],
 ["tanglebug","#ffffff","TANGLEBUG"],["hive","#b26bff","HIVE"]];
const ROLES={rootkit:"lane-hopping flipper",voltworm:"lane-flooding pulsar",
 tanglebug:"unpredictable jukes",hive:"splits when destroyed"};
const PATCHES=[["S1","#39ff6a"],["S2","#ffe14a"],["S3","#ff4fd8"],["RAP","#7df9ff"],["SHL","#b26bff"],["BMB","#ffffff"]];

function drawBug(x,y,s,type,t,col){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const paint=(c,fill,lw,blur)=>{
    ctx.strokeStyle=c; ctx.fillStyle=c; ctx.lineWidth=lw;
    ctx.shadowColor=c; ctx.shadowBlur=blur;
    ctx.beginPath();
    for(let i=0;i<6;i++){const side=i<3?-1:1,k=i%3,bx=(k-1)*6,by=side*3;
      ctx.moveTo(bx,by);ctx.lineTo(bx+Math.sin(t*9+i*2)*2,by+side*(4+k));
      ctx.lineTo(bx+Math.sin(t*9+i*2)*2+Math.sin(t*9+i)*3,by+side*(8+k));}
    ctx.stroke();
    if(type==="rootkit"){const f=Math.sin(t*6)*3;
      ctx.beginPath();
      ctx.moveTo(-9,-2+f);ctx.lineTo(0,3);ctx.lineTo(-9,8+f);ctx.closePath();
      ctx.moveTo(9,-2-f);ctx.lineTo(0,3);ctx.lineTo(9,8-f);ctx.closePath();
      if(fill){ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;}
      ctx.stroke();}
    else if(type==="voltworm"){ctx.beginPath();
      for(let a=0;a<=Math.PI*2;a+=.3){const r=5+Math.sin(a*3+t*7)*2;
        a===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r*.8):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*.8);}
      ctx.closePath();
      if(fill){ctx.globalAlpha=.45;ctx.fill();ctx.globalAlpha=1;}
      ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,2.2,0,7);ctx.fill();}
    else if(type==="tanglebug"){ctx.beginPath();
      for(let i=0;i<7;i++){const a=i/7*Math.PI*2;ctx.moveTo(Math.cos(a)*3,Math.sin(a)*3);
        ctx.lineTo(Math.cos(a)*(7+Math.sin(t*9+i)*2),Math.sin(a)*(7+Math.sin(t*9+i)*2));}
      ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,4,0,7);
      if(fill){ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1;}
      ctx.stroke();}
    else{ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(6,0);ctx.lineTo(0,7);ctx.lineTo(-6,0);ctx.closePath();
      if(fill){ctx.globalAlpha=.5;ctx.fill();ctx.globalAlpha=1;}
      ctx.stroke();
      ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(0,-3);ctx.lineTo(3,0);ctx.lineTo(0,3);ctx.closePath();ctx.stroke();}
    ctx.beginPath();ctx.moveTo(-2,-4);ctx.lineTo(-4+Math.sin(t*9),-9);
    ctx.moveTo(2,-4);ctx.lineTo(4+Math.sin(t*9+2),-9);ctx.stroke();
  };
  paint("rgba(0,0,0,.85)",false,5.5/s,7/s);
  paint(col,true,2.2/s,10/s);
  ctx.restore();
}
function drawDisk(x,y,s,type){
  const col=type[1];
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.6/s;
  ctx.shadowColor=col;ctx.shadowBlur=10/s;
  ctx.strokeRect(-8,-8,16,16);ctx.strokeRect(-4.5,-8,9,5);
  ctx.fillRect(-1,-4.5,2,2.5);
  ctx.beginPath();ctx.rect(-6,0,12,6.5);ctx.stroke();
  ctx.restore();
}

const T=1.2;
// title
ctx.fillStyle="#7df9ff";ctx.font="16px monospace";ctx.textAlign="center";
ctx.shadowColor="#7df9ff";ctx.shadowBlur=8;
ctx.fillText("P O L Y b A I U S  —  E N E M Y   C O D E X",420,34);
ctx.shadowBlur=0;ctx.textAlign="left";

// bug row
BUGS.forEach((b,i)=>{
  const x=120+i*200;
  ctx.strokeStyle="rgba(0,229,255,.35)";ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(x,160,52,10,0,0,7);ctx.stroke();
  drawBug(x,118,4.2,b[0],T+b[0].length,b[1]);
  ctx.fillStyle=b[1];ctx.font="13px monospace";ctx.textAlign="center";
  ctx.shadowColor=b[1];ctx.shadowBlur=6;
  ctx.fillText(b[2],x,206);
  ctx.fillStyle="#7d99a8";ctx.font="10px monospace";ctx.shadowBlur=0;
  ctx.fillText(ROLES[b[0]],x,222);
  ctx.textAlign="left";
});

// patches section
ctx.fillStyle="#7df9ff";ctx.font="12px monospace";ctx.textAlign="center";
ctx.shadowColor="#7df9ff";ctx.shadowBlur=5;
ctx.fillText("CODE PATCHES  ·  SHOOT TO COLLECT",420,282);
ctx.shadowBlur=0;
PATCHES.forEach((p,i)=>{
  const x=180+i*96;
  drawDisk(x,320,3,p);
  ctx.fillStyle=p[1];ctx.font="10px monospace";ctx.textAlign="center";
  ctx.shadowColor=p[1];ctx.shadowBlur=4;
  ctx.fillText(p[0],x,352);
  ctx.fillStyle="#7d99a8";ctx.shadowBlur=0;
  const fx={S1:"slow 25%",S2:"slow 40%",S3:"slow 60%",RAP:"triple-shot",SHL:"shield",BMB:"+1 bomb"};
  ctx.fillText(fx[p[0]],x,366);
});
ctx.textAlign="left";
</script>
</body>
</html>
